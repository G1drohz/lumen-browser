<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self'">
<title>Lumen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div id="bar">
    <div class="nav">
      <button id="back" title="Назад">‹</button>
      <button id="fwd" title="Вперёд">›</button>
      <button id="reload" title="Обновить">↻</button>
    </div>
    <form id="omni" autocomplete="off">
      <input id="url" type="text" spellcheck="false" placeholder="Поиск или адрес сайта">
      <button type="button" id="zoom" hidden title="Сбросить масштаб">100%</button>
      <button type="button" id="fill" hidden title="Подставить пароль">✱</button>
      <button type="button" id="star" title="В закладки">☆</button>
    </form>
  </div>
  <div id="tabs-row">
    <div id="tabs"></div>
    <button id="newtab" title="Новая вкладка">+</button>
  </div>
  <div id="find" hidden>
    <input id="findq" type="text" spellcheck="false" placeholder="Найти на странице">
    <span id="findn"></span>
    <button type="button" id="findprev" title="Назад">‹</button>
    <button type="button" id="findnext" title="Далее">›</button>
    <button type="button" id="findclose" title="Закрыть">✕</button>
  </div>
  <div id="ask" hidden></div>
</header>
<aside id="side">
  <button data-panel="bookmarks" title="Закладки">★</button>
  <button data-panel="history" title="История">◷</button>
  <button data-panel="downloads" title="Загрузки">↓</button>
  <button data-panel="passwords" title="Пароли">✱</button>
  <button data-panel="settings" title="Оформление">☀</button>
  <button data-panel="control" title="Lumen Control">⚡</button>
  <span class="grow"></span>
  <button id="home" title="Главная">⌂</button>
</aside>
<section id="panel" hidden></section>
<script src="app.js"></script>
</body>
</html>
