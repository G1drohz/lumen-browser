name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза"
        default: "v3.3.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Smoke test
        timeout-minutes: 3
        continue-on-error: true
        run: npx electron . --smoke-test
      - run: npm run dist -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: desktop/dist/Lumen-Setup-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Restore MainActivity from last known-good commit
        working-directory: .
        run: |
          set -e
          # Last good full MainActivity (mobile UA + YouTube stability)
          git show bb1581bfe1bd4357b5980d740c394234ab2072c7:android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt \
            > android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt
          # Ensure version 3.3.0
          sed -i 's/versionCode = [0-9]*/versionCode = 33/' android/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "3.3.0"/' android/app/build.gradle.kts
          # Light Ecosia-style: move chrome to top if still bottom
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt")
          c = p.read_text()
          if "import android.graphics.Color" not in c:
              c = c.replace("import android.graphics.Bitmap", "import android.graphics.Bitmap\nimport android.graphics.Color")
          old = """            addView(progress, LinearLayout.LayoutParams(-1, dp(3)))
            addView(holder, LinearLayout.LayoutParams(-1, 0, 1f))
            addView(buildBar(), LinearLayout.LayoutParams(-1, -2))"""
          new = """            addView(buildBar(), LinearLayout.LayoutParams(-1, -2))
            addView(progress, LinearLayout.LayoutParams(-1, dp(2)))
            addView(holder, LinearLayout.LayoutParams(-1, 0, 1f))"""
          if old in c:
              c = c.replace(old, new, 1)
              print("chrome moved to top")
          else:
              print("layout already top or pattern missing")
          # Soft progress fade if simple visibility still used
          old_p = "progress.visibility = if (newProgress in 1..99) View.VISIBLE else View.GONE"
          new_p = """if (newProgress in 1..99) {
                        if (progress.visibility != View.VISIBLE) {
                            progress.alpha = 0f
                            progress.visibility = View.VISIBLE
                            progress.animate().alpha(1f).setDuration(160).start()
                        }
                    } else if (progress.visibility == View.VISIBLE) {
                        progress.animate().alpha(0f).setDuration(200).withEndAction {
                            progress.visibility = View.GONE
                            progress.alpha = 1f
                        }.start()
                    }"""
          if old_p in c:
              c = c.replace(old_p, new_p, 1)
              print("progress anim")
          assert "PLACEHOLDER" not in c
          assert c.count("{") == c.count("}")
          p.write_text(c)
          print("MainActivity ready", len(c))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Lumen-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/Lumen-android.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lumen ${{ inputs.tag || github.ref_name }}
          body: |
            **Lumen 3.3.0**

            - Верхняя панель в стиле Ecosia (телефон + ПК)
            - Плавные анимации кнопок и progress
            - Мобильный просмотр страниц
            - Стабильность YouTube
            - Менеджер паролей, темы, обои

            **Windows:** `Lumen-Setup-3.3.0.exe`
            **Android:** `Lumen-android.apk`
          files: dist/*
