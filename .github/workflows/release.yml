name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза"
        default: "v3.3.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Smoke test
        timeout-minutes: 3
        continue-on-error: true
        run: npx electron . --smoke-test
      - run: npm run dist -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: desktop/dist/Lumen-Setup-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Assemble MainActivity from parts if present
        working-directory: .
        run: |
          if [ -f scripts/cat_ma.py ]; then
            python3 scripts/cat_ma.py
          else
            python3 scripts/patch_android_main.py || true
          fi
          sed -i 's/versionCode = [0-9]*/versionCode = 33/' android/app/build.gradle.kts || true
          sed -i 's/versionName = "[^"]*"/versionName = "3.3.0"/' android/app/build.gradle.kts || true
          if grep -q PLACEHOLDER android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt 2>/dev/null; then
            echo "ERROR: MainActivity still PLACEHOLDER"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Lumen-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/Lumen-android.apk
          if-no-files-found: error

  publish:
    needs: [windows]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lumen ${{ inputs.tag || github.ref_name }}
          body: |
            **Lumen 3.3.0**

            - Верхняя панель в стиле Ecosia (ПК)
            - Плавные анимации
            - Мобильный просмотр страниц
            - Стабильность YouTube
            - Менеджер паролей, темы, обои

            **Windows:** `Lumen-Setup-3.3.0.exe`
            **Android:** APK появится в следующем билде, если MainActivity восстановлен.
          files: dist/*
