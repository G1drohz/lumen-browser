name: apply-android-fix

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch MainActivity
        run: |
          set -e
          curl -fsSL -o android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt \
            https://raw.githubusercontent.com/G1drohz/lumen-browser/4d5210d99665976cf19387c6c991cdea56d71bc3/android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt
          python3 scripts/patch_android_main.py
      - name: Commit
        run: |
          git config user.name "G1dro"
          git config user.email "berkoaroslav68@gmail.com"
          git add android/app/src/main/java/dev/g1drohz/lumen/MainActivity.kt android/app/build.gradle.kts
          git commit -m "fix(android): mobile Chrome UA + YouTube stability" || exit 0
          git push
