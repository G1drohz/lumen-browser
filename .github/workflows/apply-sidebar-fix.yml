name: apply-sidebar-fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_sidebar.py
      - run: |
          git config user.name "G1dro"
          git config user.email "berkoaroslav68@gmail.com"
          git add desktop/renderer/app.js desktop/renderer/style.css desktop/main.js desktop/package.json
          git commit -m "fix(desktop): restore sidebar when hidden" || exit 0
          git push
