<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
:root{
  color-scheme:light dark;
  --accent:#7c5cff;
  --card:color-mix(in srgb, Canvas 55%, transparent);
  --edge:color-mix(in srgb, CanvasText 14%, transparent);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  background:#0b0b12;color:#f2f2f7;overflow:hidden;
}
body[data-mode="light"]{color:#1a1a1f;color-scheme:light}
body[data-mode="dark"]{color:#f2f2f7;color-scheme:dark}

/* animated mesh background */
body::before{
  content:"";position:fixed;inset:-20%;
  background:
    radial-gradient(ellipse 50% 40% at 20% 20%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 55%),
    radial-gradient(ellipse 40% 50% at 85% 15%, #ff2bd633, transparent 50%),
    radial-gradient(ellipse 45% 40% at 70% 85%, #3dffc822, transparent 50%),
    radial-gradient(ellipse 35% 35% at 10% 80%, #4aa8ff22, transparent 50%);
  animation:drift 18s ease-in-out infinite alternate;
  pointer-events:none;z-index:0;
}
@keyframes drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-3%,2%) scale(1.05)}
}
body[data-wall="dusk"]::before{background:
  radial-gradient(900px 520px at 15% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%),
  radial-gradient(700px 480px at 100% 80%, #ff2bd655, transparent 55%), transparent}
body[data-wall="aurora"]::before{background:
  radial-gradient(800px 500px at 10% 20%, #3dffc866, transparent 60%),
  radial-gradient(700px 500px at 90% 10%, #7c5cff55, transparent 55%),
  radial-gradient(600px 400px at 70% 100%, #1a6bff44, transparent 50%), transparent}
body[data-wall="ember"]::before{background:
  radial-gradient(800px 480px at 20% 100%, #ff6a3d88, transparent 55%),
  radial-gradient(600px 400px at 90% 0%, #ffc14a55, transparent 50%), transparent}
body[data-wall="ocean"]::before{background:
  radial-gradient(900px 500px at 50% 120%, #1a6bff88, transparent 55%),
  radial-gradient(500px 400px at 0% 0%, #4aa8ff55, transparent 50%), transparent}
body[data-wall="forest"]::before{background:
  radial-gradient(700px 500px at 0% 100%, #1f8a4c88, transparent 55%),
  radial-gradient(600px 400px at 100% 0%, #c6f54a44, transparent 50%), transparent}
body[data-wall="mesh"]::before{background:
  radial-gradient(400px 400px at 20% 30%, color-mix(in srgb, var(--accent) 50%, transparent), transparent 70%),
  radial-gradient(380px 380px at 80% 20%, #ff7ad955, transparent 70%),
  radial-gradient(420px 420px at 60% 80%, #4aa8ff55, transparent 70%), transparent}
body[data-wall="grid"]{
  background:
    linear-gradient(color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
    #101018;
  background-size:28px 28px,28px 28px,auto;
}
body[data-wall="grid"]::before{opacity:.5}
body[data-wall="none"]::before{opacity:.35}
#shade{position:fixed;inset:0;background:rgba(8,8,14,.35);pointer-events:none;z-index:0}
body[data-mode="light"] #shade{background:rgba(255,255,255,.25)}

main{
  position:relative;z-index:1;width:min(680px,94vw);
  display:flex;flex-direction:column;align-items:center;gap:28px;padding:48px 0 56px;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

h1{
  margin:0;font-weight:800;font-size:clamp(40px,7vw,56px);letter-spacing:-.04em;
  background:linear-gradient(120deg, #fff 20%, var(--accent) 55%, #ff6ad5 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px color-mix(in srgb, var(--accent) 40%, transparent));
}
body[data-mode="light"] h1{
  background:linear-gradient(120deg, #1a1a1f 10%, var(--accent) 50%, #c44 90%);
  -webkit-background-clip:text;background-clip:text;
}

form{width:min(520px,100%)}
input{
  width:100%;padding:16px 22px;border-radius:999px;
  border:1px solid var(--edge);
  background:color-mix(in srgb, Canvas 40%, rgba(20,20,30,.55));
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  color:inherit;font:inherit;outline:0;
  box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .2s, box-shadow .2s, transform .2s;
}
body[data-mode="light"] input{
  background:rgba(255,255,255,.7);
  box-shadow:0 8px 28px rgba(0,0,0,.08), inset 0 1px 0 #fff;
}
input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent), 0 12px 36px rgba(0,0,0,.3);
  transform:translateY(-1px);
}
input::placeholder{color:color-mix(in srgb, CanvasText 45%, transparent)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(88px, 1fr));
  gap:20px 16px;
  width:min(520px,100%);
  justify-content:center;
}

.tile{position:relative;animation:pop .4s cubic-bezier(.2,.9,.3,1.15) both}
.tile:nth-child(1){animation-delay:.03s}
.tile:nth-child(2){animation-delay:.06s}
.tile:nth-child(3){animation-delay:.09s}
.tile:nth-child(4){animation-delay:.12s}
.tile:nth-child(5){animation-delay:.15s}
.tile:nth-child(6){animation-delay:.18s}
.tile:nth-child(7){animation-delay:.21s}
.tile:nth-child(8){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}

a.site,a.sc-add{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  color:inherit;text-decoration:none;font-size:12px;font-weight:500;min-width:0;
}
a.site b,a.sc-add b{
  max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:center;opacity:.9;
}
.icon{
  width:72px;height:72px;border-radius:22px;display:grid;place-items:center;
  font-style:normal;font-size:26px;font-weight:700;color:#fff;
  background:
    linear-gradient(145deg,
      color-mix(in srgb, var(--accent) 100%, #fff 10%),
      color-mix(in srgb, var(--accent) 55%, #1a1030));
  box-shadow:
    0 10px 28px color-mix(in srgb, var(--accent) 40%, transparent),
    0 2px 0 rgba(255,255,255,.15) inset,
    0 -2px 0 rgba(0,0,0,.2) inset;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.2), box-shadow .22s;
  position:relative;overflow:hidden;
}
.icon img{width:34px;height:34px;border-radius:8px;object-fit:contain;position:relative;z-index:1}
.icon::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.28), transparent 45%, rgba(0,0,0,.12));
  pointer-events:none;
}
a.site:hover .icon{
  transform:translateY(-6px) scale(1.06);
  box-shadow:
    0 18px 36px color-mix(in srgb, var(--accent) 55%, transparent),
    0 2px 0 rgba(255,255,255,.2) inset;
}
.tile .rm{
  position:absolute;top:-2px;right:6px;width:22px;height:22px;border-radius:50%;border:0;
  background:rgba(20,20,28,.85);color:#fff;font:12px/22px system-ui;
  cursor:pointer;opacity:0;transform:scale(.7);z-index:2;
  transition:opacity .15s, transform .15s;backdrop-filter:blur(8px);
}
.tile:hover .rm{opacity:1;transform:scale(1)}
.tile .rm:hover{background:#e23}

/* + tile — only add control */
a.sc-add .icon{
  background:rgba(255,255,255,.06)!important;
  color:rgba(255,255,255,.7)!important;
  border:2px dashed rgba(255,255,255,.22);
  box-shadow:none;font-size:32px;font-weight:300;
}
a.sc-add .icon::before{display:none}
body[data-mode="light"] a.sc-add .icon{
  background:rgba(0,0,0,.04)!important;color:rgba(0,0,0,.45)!important;
  border-color:rgba(0,0,0,.18);
}
a.sc-add:hover .icon{
  border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 18%, transparent)!important;
  color:var(--accent)!important;
  transform:translateY(-6px) scale(1.06);
  box-shadow:0 12px 28px color-mix(in srgb, var(--accent) 35%, transparent);
}

.note{margin:0;color:rgba(255,255,255,.55);text-align:center;font-size:13px}
body[data-mode="light"] .note{color:rgba(0,0,0,.5)}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(3,1fr);gap:14px}
  .icon{width:64px;height:64px;border-radius:18px}
}
</style>
</head>
<body>
<div id="shade"></div>
<main>
  <h1>Lumen</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Поиск или адрес" autocomplete="off">
  </form>
  <div class="grid" id="shortcuts"></div>
</main>
<script>
function sendSc(payload) {
  try { console.log('LUMEN_SC ' + JSON.stringify(payload)); } catch (e) {}
}
function faviconUrl(url) {
  try {
    var u = new URL(url);
    return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(u.hostname) + '&sz=64';
  } catch (e) { return ''; }
}
function tile(b, editable) {
  var wrap = document.createElement('div');
  wrap.className = 'tile';
  var a = document.createElement('a');
  a.className = 'site';
  a.href = b.url;
  var icon = document.createElement('div');
  icon.className = 'icon';
  var fav = faviconUrl(b.url);
  if (fav) {
    var img = document.createElement('img');
    img.src = fav; img.alt = ''; img.loading = 'lazy';
    img.onerror = function () {
      img.remove();
      icon.textContent = String(b.title || b.url).trim().charAt(0).toUpperCase() || '•';
    };
    icon.appendChild(img);
  } else {
    icon.textContent = String(b.title || b.url).trim().charAt(0).toUpperCase() || '•';
  }
  var label = document.createElement('b');
  label.textContent = b.title || b.url;
  a.appendChild(icon); a.appendChild(label);
  wrap.appendChild(a);
  if (editable) {
    var rm = document.createElement('button');
    rm.className = 'rm'; rm.type = 'button'; rm.title = 'Удалить'; rm.textContent = '✕';
    rm.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      sendSc({ op: 'remove', url: b.url });
    });
    wrap.appendChild(rm);
  }
  return wrap;
}
function doAdd() {
  var url = prompt('Адрес сайта', 'https://');
  if (!url) return;
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  var title = prompt('Название', url.replace(/^https?:\/\//i, '').split('/')[0]) || url;
  sendSc({ op: 'add', url: url, title: title });
}
function addTile() {
  var wrap = document.createElement('div');
  wrap.className = 'tile';
  var a = document.createElement('a');
  a.href = '#'; a.className = 'sc-add';
  a.addEventListener('click', function (ev) { ev.preventDefault(); doAdd(); });
  var icon = document.createElement('div');
  icon.className = 'icon'; icon.textContent = '+';
  var label = document.createElement('b');
  label.textContent = 'Добавить';
  a.appendChild(icon); a.appendChild(label);
  wrap.appendChild(a);
  return wrap;
}
window.applyLumen = function (cfg) {
  cfg = cfg || {};
  var accent = /^#[0-9a-f]{6}$/i.test(cfg.accent) ? cfg.accent : '#7c5cff';
  document.documentElement.style.setProperty('--accent', accent);
  document.body.dataset.mode = cfg.mode === 'light' || cfg.mode === 'dark' ? cfg.mode : 'dark';
  var walls = { none:1,dusk:1,aurora:1,ember:1,ocean:1,forest:1,mesh:1,grid:1,custom:1 };
  var wall = walls[cfg.wallpaper] ? cfg.wallpaper : 'none';
  document.body.dataset.wall = wall;
  if (wall === 'custom' && typeof cfg.image === 'string' && cfg.image.indexOf('data:image/') === 0) {
    document.body.style.backgroundImage = 'url("' + cfg.image.replace(/["\\\r\n]/g, '') + '")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
  } else document.body.style.backgroundImage = '';
  if (cfg.fontScale) document.body.style.fontSize = Math.round(15 * cfg.fontScale / 100) + 'px';

  var grid = document.getElementById('shortcuts');
  grid.textContent = '';

  if (cfg.bookmarksMode) {
    var list = Array.isArray(cfg.bookmarks) ? cfg.bookmarks : [];
    if (!list.length) {
      var p = document.createElement('p'); p.className = 'note';
      p.textContent = 'Закладок пока нет.';
      grid.appendChild(p); return;
    }
    list.forEach(function (b) {
      if (!b || !/^https?:\/\//i.test(b.url || '')) return;
      grid.appendChild(tile(b, false));
    });
    return;
  }

  var shortcuts = Array.isArray(cfg.shortcuts) ? cfg.shortcuts : [];
  shortcuts.forEach(function (b) {
    if (!b || !/^https?:\/\//i.test(b.url || '')) return;
    grid.appendChild(tile(b, !!cfg.editable));
  });
  if (cfg.editable) grid.appendChild(addTile());
};
</script>
</body>
</html>
