<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
:root{color-scheme:light dark;--accent:#7c5cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:Canvas;color:CanvasText}
body[data-mode="dark"]{color:#f4f4f7;color-scheme:dark}
body[data-mode="light"]{color:#1d1d1f;color-scheme:light}
body[data-wall="dusk"]{background:
  radial-gradient(900px 520px at 15% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%),
  radial-gradient(700px 480px at 100% 80%, #ff2bd655, transparent 55%), #12121a}
body[data-wall="aurora"]{background:
  radial-gradient(800px 500px at 10% 20%, #3dffc866, transparent 60%),
  radial-gradient(700px 500px at 90% 10%, #7c5cff55, transparent 55%),
  radial-gradient(600px 400px at 70% 100%, #1a6bff44, transparent 50%), #071410}
body[data-wall="ember"]{background:
  radial-gradient(800px 480px at 20% 100%, #ff6a3d88, transparent 55%),
  radial-gradient(600px 400px at 90% 0%, #ffc14a55, transparent 50%), #160e0a}
body[data-wall="ocean"]{background:
  radial-gradient(900px 500px at 50% 120%, #1a6bff88, transparent 55%),
  radial-gradient(500px 400px at 0% 0%, #4aa8ff55, transparent 50%), #071018}
body[data-wall="forest"]{background:
  radial-gradient(700px 500px at 0% 100%, #1f8a4c88, transparent 55%),
  radial-gradient(600px 400px at 100% 0%, #c6f54a44, transparent 50%), #0c1610}
body[data-wall="mesh"]{background:
  radial-gradient(400px 400px at 20% 30%, color-mix(in srgb, var(--accent) 50%, transparent), transparent 70%),
  radial-gradient(380px 380px at 80% 20%, #ff7ad955, transparent 70%),
  radial-gradient(420px 420px at 60% 80%, #4aa8ff55, transparent 70%), #101014}
body[data-wall="grid"]{background:
  linear-gradient(color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
  linear-gradient(90deg, color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
  Canvas;background-size:32px 32px,32px 32px,auto}
#shade{position:fixed;inset:0;background:color-mix(in srgb, Canvas 42%, transparent);pointer-events:none}
body[data-wall="none"] #shade,body:not([data-wall]) #shade{display:none}
main{position:relative;z-index:1;width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;gap:28px;padding:32px 0}
h1{margin:0;font-weight:600;font-size:42px;letter-spacing:-.02em}
form{width:min(560px,100%)}
input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid color-mix(in srgb, CanvasText 15%, transparent);background:color-mix(in srgb, Canvas 82%, transparent);color:inherit;font:inherit;outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent)}
.grid{display:grid;grid-template-columns:repeat(4,84px);gap:16px;justify-content:center}
a{display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit;text-decoration:none;font-size:12px;min-width:0}
a b{font-weight:500;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a i{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:600;color:#fff;background:var(--accent);transition:transform .15s}
a:hover i{transform:translateY(-3px)}
.note{margin:0;color:color-mix(in srgb, CanvasText 70%, transparent);text-align:center;font-size:14px}
.tile{position:relative}
.tile .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:color-mix(in srgb, CanvasText 75%, transparent);color:Canvas;font:12px/22px system-ui;cursor:pointer;opacity:0;transition:opacity .15s}
.tile:hover .rm{opacity:1}
.sc-add i{background:color-mix(in srgb, CanvasText 18%, transparent)!important;color:inherit!important;border:1px dashed color-mix(in srgb, CanvasText 35%, transparent)}
.sc-add:hover i{transform:translateY(-3px);border-color:var(--accent)}
#editbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#editbar button{padding:8px 14px;border-radius:10px;border:1px solid color-mix(in srgb, CanvasText 15%, transparent);background:color-mix(in srgb, Canvas 82%, transparent);color:inherit;font:inherit;cursor:pointer}
#editbar button:hover{border-color:var(--accent)}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,84px)} h1{font-size:34px}}
</style>
</head>
<body>
<div id="shade"></div>
<main>
  <h1>Lumen</h1>
  <form action="https://duckduckgo.com/" method="get"><input name="q" placeholder="Поиск в DuckDuckGo" autocomplete="off"></form>
  <div class="grid" id="shortcuts"></div>
  <div id="editbar" hidden></div>
</main>
<script>
function sendSc(payload) {
  console.log('LUMEN_SC ' + JSON.stringify(payload));
}
function tile(b, editable) {
  var wrap = document.createElement('div');
  wrap.className = 'tile';
  var a = document.createElement('a');
  a.href = b.url;
  var i = document.createElement('i');
  var title = String(b.title || b.url);
  i.textContent = title.trim().charAt(0).toUpperCase() || '\u2022';
  var label = document.createElement('b');
  label.textContent = title;
  a.appendChild(i);
  a.appendChild(label);
  wrap.appendChild(a);
  if (editable) {
    var rm = document.createElement('button');
    rm.className = 'rm';
    rm.type = 'button';
    rm.title = '\u0423\u0434\u0430\u043b\u0438\u0442\u044c';
    rm.textContent = '\u2715';
    rm.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      sendSc({ op: 'remove', url: b.url });
    });
    wrap.appendChild(rm);
  }
  return wrap;
}
window.applyLumen = function (cfg) {
  cfg = cfg || {};
  var accent = /^#[0-9a-f]{6}$/i.test(cfg.accent) ? cfg.accent : '#7c5cff';
  document.documentElement.style.setProperty('--accent', accent);
  document.body.dataset.mode = cfg.mode === 'light' || cfg.mode === 'dark' ? cfg.mode : '';
  var walls = { none: 1, dusk: 1, aurora: 1, ember: 1, ocean: 1, forest: 1, mesh: 1, grid: 1, custom: 1 };
  var wall = walls[cfg.wallpaper] ? cfg.wallpaper : 'none';
  document.body.dataset.wall = wall;
  if (wall === 'custom' && typeof cfg.image === 'string' && cfg.image.indexOf('data:image/') === 0) {
    document.body.style.backgroundImage = 'url("' + cfg.image.replace(/["\\\r\n]/g, '') + '")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
  } else {
    document.body.style.backgroundImage = '';
  }
  if (cfg.fontScale) document.body.style.fontSize = Math.round(15 * cfg.fontScale / 100) + 'px';
  var grid = document.getElementById('shortcuts');
  var bar = document.getElementById('editbar');
  grid.textContent = '';
  grid.style.display = '';
  if (cfg.bookmarksMode) {
    bar.hidden = true;
    var list = Array.isArray(cfg.bookmarks) ? cfg.bookmarks : [];
    if (!list.length) {
      grid.style.display = 'block';
      var p = document.createElement('p');
      p.className = 'note';
      p.textContent = '\u0417\u0430\u043a\u043b\u0430\u0434\u043e\u043a \u043f\u043e\u043a\u0430 \u043d\u0435\u0442. \u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u0441\u0430\u0439\u0442 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u0437\u0432\u0451\u0437\u0434\u043e\u0447\u043a\u0443 \u0432 \u0430\u0434\u0440\u0435\u0441\u043d\u043e\u0439 \u0441\u0442\u0440\u043e\u043a\u0435.';
      grid.appendChild(p);
      return;
    }
    list.forEach(function (b) {
      if (!b || !/^https?:\/\//i.test(b.url || '')) return;
      grid.appendChild(tile(b, false));
    });
    return;
  }
  var shortcuts = Array.isArray(cfg.shortcuts) ? cfg.shortcuts : [];
  shortcuts.forEach(function (b) {
    if (!b || !/^https?:\/\//i.test(b.url || '')) return;
    grid.appendChild(tile(b, !!cfg.editable));
  });
  if (cfg.editable) {
    var add = document.createElement('a');
    add.href = '#';
    add.className = 'sc-add';
    add.addEventListener('click', function (ev) {
      ev.preventDefault();
      var url = prompt('\u0410\u0434\u0440\u0435\u0441 \u0441\u0430\u0439\u0442\u0430 \u0434\u043b\u044f \u044d\u043a\u0441\u043f\u0440\u0435\u0441\u0441-\u043f\u0430\u043d\u0435\u043b\u0438', 'https://');
      if (!url) return;
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      var title = prompt('\u041d\u0430\u0437\u0432\u0430\u043d\u0438\u0435', url.replace(/^https?:\/\//i, '').split('/')[0]) || url;
      sendSc({ op: 'add', url: url, title: title });
    });
    var ai = document.createElement('i');
    ai.textContent = '+';
    var ab = document.createElement('b');
    ab.textContent = '\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c';
    add.appendChild(ai);
    add.appendChild(ab);
    grid.appendChild(add);
    bar.hidden = false;
    bar.replaceChildren();
    var reset = document.createElement('button');
    reset.type = 'button';
    reset.textContent = '\u0421\u0431\u0440\u043e\u0441\u0438\u0442\u044c \u043f\u0430\u043d\u0435\u043b\u044c';
    reset.addEventListener('click', function () { sendSc({ op: 'reset' }); });
    bar.appendChild(reset);
  } else {
    bar.hidden = true;
  }
};
</script>
</body>
</html>
