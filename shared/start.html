<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
:root{
  color-scheme:light dark;
  --accent:#7c5cff;
  --glass:color-mix(in srgb, Canvas 72%, transparent);
  --glass-border:color-mix(in srgb, CanvasText 12%, transparent);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:Canvas;color:CanvasText;overflow-x:hidden;
}
body[data-mode="dark"]{color:#f4f4f7;color-scheme:dark}
body[data-mode="light"]{color:#1d1d1f;color-scheme:light}
body[data-wall="dusk"]{background:
  radial-gradient(900px 520px at 15% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%),
  radial-gradient(700px 480px at 100% 80%, #ff2bd655, transparent 55%), #12121a}
body[data-wall="aurora"]{background:
  radial-gradient(800px 500px at 10% 20%, #3dffc866, transparent 60%),
  radial-gradient(700px 500px at 90% 10%, #7c5cff55, transparent 55%),
  radial-gradient(600px 400px at 70% 100%, #1a6bff44, transparent 50%), #071410}
body[data-wall="ember"]{background:
  radial-gradient(800px 480px at 20% 100%, #ff6a3d88, transparent 55%),
  radial-gradient(600px 400px at 90% 0%, #ffc14a55, transparent 50%), #160e0a}
body[data-wall="ocean"]{background:
  radial-gradient(900px 500px at 50% 120%, #1a6bff88, transparent 55%),
  radial-gradient(500px 400px at 0% 0%, #4aa8ff55, transparent 50%), #071018}
body[data-wall="forest"]{background:
  radial-gradient(700px 500px at 0% 100%, #1f8a4c88, transparent 55%),
  radial-gradient(600px 400px at 100% 0%, #c6f54a44, transparent 50%), #0c1610}
body[data-wall="mesh"]{background:
  radial-gradient(400px 400px at 20% 30%, color-mix(in srgb, var(--accent) 50%, transparent), transparent 70%),
  radial-gradient(380px 380px at 80% 20%, #ff7ad955, transparent 70%),
  radial-gradient(420px 420px at 60% 80%, #4aa8ff55, transparent 70%), #101014}
body[data-wall="grid"]{background:
  linear-gradient(color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
  linear-gradient(90deg, color-mix(in srgb, CanvasText 8%, transparent) 1px, transparent 1px),
  Canvas;background-size:32px 32px,32px 32px,auto}
#shade{position:fixed;inset:0;background:color-mix(in srgb, Canvas 38%, transparent);pointer-events:none}
body[data-wall="none"] #shade,body:not([data-wall]) #shade{display:none}

main{
  position:relative;z-index:1;width:min(720px,94vw);
  display:flex;flex-direction:column;align-items:center;gap:22px;padding:36px 0 48px;
  animation:rise .4s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{
  margin:0;font-weight:700;font-size:clamp(32px,5.5vw,44px);letter-spacing:-.03em;
  background:linear-gradient(135deg, CanvasText 30%, var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
form{width:min(480px,100%)}
input{
  width:100%;padding:14px 18px;border-radius:14px;
  border:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:inherit;font:inherit;outline:0;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  transition:border-color .15s, box-shadow .15s;
}
input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent);
}

.panel-head{
  width:min(480px,100%);display:flex;align-items:center;justify-content:space-between;
  padding:0 2px;
}
.panel-head h2{
  margin:0;font-size:13px;font-weight:600;
  color:color-mix(in srgb, CanvasText 80%, transparent);
}
.panel-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  display:grid;place-items:center;font-size:16px;line-height:1;
  background:color-mix(in srgb, CanvasText 10%, transparent);
  color:inherit;transition:transform .12s, background .12s;
}
.icon-btn:hover{background:color-mix(in srgb, var(--accent) 25%, transparent);transform:scale(1.06)}
.icon-btn.primary{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 10px color-mix(in srgb, var(--accent) 40%, transparent);
}
.icon-btn.primary:hover{filter:brightness(1.08)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:14px;
  width:min(480px,100%);
  justify-content:center;
}

.tile{position:relative}
a.site,a.sc-add{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  color:inherit;text-decoration:none;font-size:11px;min-width:0;
}
a.site b,a.sc-add b{
  font-weight:500;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-align:center;opacity:.88;
}
.icon{
  width:56px;height:56px;border-radius:14px;display:grid;place-items:center;
  font-style:normal;font-size:18px;font-weight:700;color:#fff;
  background:linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
  box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s;
  position:relative;overflow:hidden;
}
.icon img{width:28px;height:28px;border-radius:6px;object-fit:contain}
.icon::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.2), transparent 50%);
  pointer-events:none;
}
a.site:hover .icon{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 8px 20px color-mix(in srgb, var(--accent) 45%, transparent);
}
.tile .rm{
  position:absolute;top:-4px;right:4px;width:18px;height:18px;border-radius:50%;border:0;
  background:color-mix(in srgb, CanvasText 75%, transparent);color:Canvas;
  font:11px/18px system-ui;cursor:pointer;opacity:0;z-index:2;
  transition:opacity .12s;
}
.tile:hover .rm{opacity:1}
.tile .rm:hover{background:#e23;color:#fff}

/* small cube + */
a.sc-add .icon{
  width:56px;height:56px;border-radius:14px;
  background:color-mix(in srgb, CanvasText 8%, transparent)!important;
  color:inherit!important;
  border:1.5px dashed color-mix(in srgb, CanvasText 28%, transparent);
  box-shadow:none;font-size:26px;font-weight:400;
}
a.sc-add .icon::after{display:none}
a.sc-add:hover .icon{
  border-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 14%, transparent)!important;
  color:var(--accent)!important;
  transform:translateY(-3px);
}

.note{margin:0;color:color-mix(in srgb, CanvasText 65%, transparent);text-align:center;font-size:13px}

@media (max-width:480px){
  .grid{grid-template-columns:repeat(4,1fr);gap:10px}
  .icon,a.sc-add .icon{width:48px;height:48px;border-radius:12px}
}
</style>
</head>
<body>
<div id="shade"></div>
<main>
  <h1>Lumen</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Поиск или адрес сайта" autocomplete="off">
  </form>

  <div class="panel-head" id="panelHead" hidden>
    <h2>Экспресс-панель</h2>
    <div class="panel-actions">
      <button type="button" class="icon-btn" id="btnReset" title="Сбросить">↻</button>
      <button type="button" class="icon-btn primary" id="btnAdd" title="Добавить сайт">+</button>
    </div>
  </div>

  <div class="grid" id="shortcuts"></div>
</main>
<script>
function sendSc(payload) {
  try { console.log('LUMEN_SC ' + JSON.stringify(payload)); } catch (e) {}
}
function faviconUrl(url) {
  try {
    var u = new URL(url);
    return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(u.hostname) + '&sz=64';
  } catch (e) { return ''; }
}
function tile(b, editable) {
  var wrap = document.createElement('div');
  wrap.className = 'tile';
  var a = document.createElement('a');
  a.className = 'site';
  a.href = b.url;
  var icon = document.createElement('div');
  icon.className = 'icon';
  var fav = faviconUrl(b.url);
  if (fav) {
    var img = document.createElement('img');
    img.src = fav; img.alt = ''; img.loading = 'lazy';
    img.onerror = function () {
      img.remove();
      icon.textContent = String(b.title || b.url).trim().charAt(0).toUpperCase() || '•';
    };
    icon.appendChild(img);
  } else {
    icon.textContent = String(b.title || b.url).trim().charAt(0).toUpperCase() || '•';
  }
  var label = document.createElement('b');
  label.textContent = b.title || b.url;
  a.appendChild(icon); a.appendChild(label);
  wrap.appendChild(a);
  if (editable) {
    var rm = document.createElement('button');
    rm.className = 'rm'; rm.type = 'button'; rm.title = 'Удалить'; rm.textContent = '✕';
    rm.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      sendSc({ op: 'remove', url: b.url });
    });
    wrap.appendChild(rm);
  }
  return wrap;
}
function doAdd() {
  var url = prompt('Адрес сайта', 'https://');
  if (!url) return;
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  var title = prompt('Название', url.replace(/^https?:\/\//i, '').split('/')[0]) || url;
  sendSc({ op: 'add', url: url, title: title });
}
function addTile() {
  var wrap = document.createElement('div');
  wrap.className = 'tile';
  var a = document.createElement('a');
  a.href = '#'; a.className = 'sc-add';
  a.addEventListener('click', function (ev) { ev.preventDefault(); doAdd(); });
  var icon = document.createElement('div');
  icon.className = 'icon'; icon.textContent = '+';
  var label = document.createElement('b');
  label.textContent = 'Добавить';
  a.appendChild(icon); a.appendChild(label);
  wrap.appendChild(a);
  return wrap;
}
window.applyLumen = function (cfg) {
  cfg = cfg || {};
  var accent = /^#[0-9a-f]{6}$/i.test(cfg.accent) ? cfg.accent : '#7c5cff';
  document.documentElement.style.setProperty('--accent', accent);
  document.body.dataset.mode = cfg.mode === 'light' || cfg.mode === 'dark' ? cfg.mode : '';
  var walls = { none:1,dusk:1,aurora:1,ember:1,ocean:1,forest:1,mesh:1,grid:1,custom:1 };
  var wall = walls[cfg.wallpaper] ? cfg.wallpaper : 'none';
  document.body.dataset.wall = wall;
  if (wall === 'custom' && typeof cfg.image === 'string' && cfg.image.indexOf('data:image/') === 0) {
    document.body.style.backgroundImage = 'url("' + cfg.image.replace(/["\\\r\n]/g, '') + '")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
  } else document.body.style.backgroundImage = '';
  if (cfg.fontScale) document.body.style.fontSize = Math.round(15 * cfg.fontScale / 100) + 'px';

  var grid = document.getElementById('shortcuts');
  var head = document.getElementById('panelHead');
  grid.textContent = '';

  if (cfg.bookmarksMode) {
    head.hidden = true;
    var list = Array.isArray(cfg.bookmarks) ? cfg.bookmarks : [];
    if (!list.length) {
      var p = document.createElement('p'); p.className = 'note';
      p.textContent = 'Закладок пока нет.';
      grid.appendChild(p); return;
    }
    list.forEach(function (b) {
      if (!b || !/^https?:\/\//i.test(b.url || '')) return;
      grid.appendChild(tile(b, false));
    });
    return;
  }

  var shortcuts = Array.isArray(cfg.shortcuts) ? cfg.shortcuts : [];
  shortcuts.forEach(function (b) {
    if (!b || !/^https?:\/\//i.test(b.url || '')) return;
    grid.appendChild(tile(b, !!cfg.editable));
  });
  if (cfg.editable) {
    head.hidden = false;
    document.getElementById('btnAdd').onclick = doAdd;
    document.getElementById('btnReset').onclick = function () { sendSc({ op: 'reset' }); };
    grid.appendChild(addTile());
  } else {
    head.hidden = true;
  }
};
</script>
</body>
</html>
