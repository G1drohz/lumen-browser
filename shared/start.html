<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
:root{color-scheme:light dark;--accent:#7c5cff}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--accent) 35%,transparent),transparent),Canvas;color:CanvasText}
h1{margin:0;font-weight:600;font-size:42px;letter-spacing:-.02em}
form{width:min(560px,86vw)}
input{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:14px;border:1px solid color-mix(in srgb,CanvasText 15%,transparent);background:color-mix(in srgb,Canvas 85%,CanvasText 5%);color:inherit;font:inherit;outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.grid{display:grid;grid-template-columns:repeat(4,84px);gap:16px}
a{display:flex;flex-direction:column;align-items:center;gap:8px;color:inherit;text-decoration:none;font-size:12px}
a i{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:600;color:#fff;transition:transform .15s}
a:hover i{transform:translateY(-3px)}
</style>
</head>
<body>
<h1>Lumen</h1>
<form action="https://duckduckgo.com/" method="get"><input name="q" placeholder="Поиск в DuckDuckGo" autocomplete="off"></form>
<div class="grid">
<a href="https://github.com"><i style="background:#24292f">G</i>GitHub</a>
<a href="https://www.youtube.com"><i style="background:#e62117">Y</i>YouTube</a>
<a href="https://ru.wikipedia.org"><i style="background:#636466">W</i>Wikipedia</a>
<a href="https://www.reddit.com"><i style="background:#ff4500">R</i>Reddit</a>
<a href="https://web.telegram.org"><i style="background:#2aabee">T</i>Telegram</a>
<a href="https://ya.ru"><i style="background:#fc3f1d">Я</i>Яндекс</a>
<a href="https://claude.ai"><i style="background:#d97757">C</i>Claude</a>
<a href="https://www.twitch.tv"><i style="background:#9146ff">T</i>Twitch</a>
</div>
</body>
</html>
